[package]
name = "dakia-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dakia-domain = { path = "../domain" }
dakia-storage = { path = "../storage" }
dakia-inference = { path = "../inference" }
dakia-mail-provider = { path = "../mail-provider" }
mail-parser = "0.11"
mail-auth = { version = "0.10", default-features = false, features = ["ring"] }
percent-encoding = "2"
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
uuid.workspace = true
sqlx.workspace = true
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["fs", "limit", "trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true
argon2 = "0.5"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2"
openidconnect = "4"
async-stream = "0.3"
reqwest.workspace = true
whatlang = "0.18"
scraper = { version = "0.24", default-features = false }
roxmltree = "0.21"
hickory-resolver = "0.24"

[dev-dependencies]
native-tls = "0.2"
tokio-native-tls = "0.3"
rcgen = "0.14"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls", "hostname"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
openssl = "0.10"
