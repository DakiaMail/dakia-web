<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chrome translation prototype</title>
<style>:root{color-scheme:light dark;font:16px/1.5 system-ui}body{max-width:900px;margin:40px auto;padding:0 20px}button,select{font:inherit;padding:10px;margin:4px}button:focus-visible,select:focus-visible{outline:3px solid #3486ff;outline-offset:3px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>Chrome translation prototype</h1><p>Translate synthetic messages with Chrome's saved language packs.</p><label for="source">Source language</label><select id="source"><option value="de">German</option><option value="ar">Arabic</option><option value="zh">Chinese</option><option value="ja">Japanese</option><option value="et">Estonian</option></select><button id="run">Run benchmark</button><p id="status" role="status">Ready</p><pre id="output" aria-label="Benchmark results"></pre><script type="module" src="/native.mjs"></script></html>
