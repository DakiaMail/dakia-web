[package]
name = "dakia-mail-provider"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MPL-2.0"

[dependencies]
async-imap = { version = "=0.12.0", default-features = false, features = ["runtime-tokio"] }
async-trait = "0.1"
imap-proto = "=0.17.0"
futures-util = "0.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls", "hostname"] }
mail-parser = "0.11"
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
sha2 = "0.10"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt-multi-thread"] }
tokio-native-tls = "0.3"

[dev-dependencies]
rcgen = "0.14"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
openssl = "0.10"
