name: dakia
services:
  dakia:
    image: ${DAKIA_IMAGE:-ghcr.io/dakiamail/dakia-web@sha256:70ddb24c20017341a3116aa1e6a7db704e1170625c6ed82a731d8be102ede8d9}
    restart: unless-stopped
    environment:
      DAKIA_ORIGIN: ${DAKIA_ORIGIN:?Set the external HTTPS address in .env}
      DAKIA_GMAIL_CLIENT_ID: ${DAKIA_GMAIL_CLIENT_ID:-}
      DAKIA_GMAIL_CLIENT_SECRET: ${DAKIA_GMAIL_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:${DAKIA_PORT:-3025}:3025"
    volumes:
      - data:/data
      - secrets:/secrets
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
volumes:
  data:
  secrets:
