name: Demo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          DAKIA_BUILD_ID: ${{ github.sha }}
      - run: npm run build:demo
        env:
          DAKIA_BUILD_ID: ${{ github.sha }}
      - run: npm run test:demo
      - run: npm run test:parity
      - uses: actions/upload-artifact@v4
        with:
          name: demo-build
          path: apps/web/dist-demo
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-browser-evidence
          path: |
            apps/web/artifacts/demo
            apps/web/test-results
          retention-days: 7
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: demo
      url: https://demo.dakiamail.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: demo-build
          path: demo-dist
      - run: npm ci
      - name: Publish candidate
        id: candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const output = execFileSync('npx', ['--yes', 'wrangler@4.114.0', 'pages', 'deploy', 'demo-dist', '--project-name', 'dakia-demo', '--branch', `verify-${process.env.GITHUB_SHA.slice(0, 12)}`, '--commit-hash', process.env.GITHUB_SHA, '--commit-dirty=false'], { encoding: 'utf8' });
          process.stdout.write(output);
          const url = output.match(/https:\/\/[a-z0-9]+\.dakia-demo\.pages\.dev/)?.[0];
          if (!url) throw new Error('Candidate URL missing');
          appendFileSync(process.env.GITHUB_OUTPUT, `url=${url}\n`);
          JS
      - name: Check candidate in Chrome
        run: npm run test:demo
        env:
          DEMO_URL: ${{ steps.candidate.outputs.url }}
      - name: Publish verified frontend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.114.0 pages deploy demo-dist --project-name dakia-demo --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false
      - name: Verify release and transport boundary
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = 'https://demo.dakiamail.com';
          const version = await fetch(`${base}/app-version.json`, { cache: 'no-store' }).then(r => r.json());
          assert.equal(version.version, process.env.GITHUB_SHA);
          for (const path of ['/api/session', '/auth/login']) {
            const response = await fetch(base + path, { redirect: 'manual' });
            assert.equal(response.status, 404);
          }
          JS
