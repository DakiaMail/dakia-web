name: dakia
services:
  dakia:
    # Dakia v0.1.0, pinned to the published release manifest.
    image: ${DAKIA_IMAGE:-ghcr.io/dakiamail/dakia-web@sha256:8c5d80656cd1cdd4a48c5129ec55e9e56f5ed96a41cf2881ce41f382f9df30f4}
    restart: unless-stopped
    environment:
      DAKIA_VAPID_FILE: ${DAKIA_VAPID_FILE:-}
      DAKIA_VAPID_SUBJECT: ${DAKIA_VAPID_SUBJECT:-}
      DAKIA_ADMIN_USERS: ${DAKIA_ADMIN_USERS:-}
      DAKIA_ORIGIN: ${DAKIA_ORIGIN:?Set the external HTTPS address in .env}
      DAKIA_RELEASE_CHECKS: ${DAKIA_RELEASE_CHECKS:-true}
      DAKIA_DATABASE_URL: ${DAKIA_DATABASE_URL:-}
      DAKIA_SEARCH_DATABASE_URL: ${DAKIA_SEARCH_DATABASE_URL:-}
      DAKIA_GMAIL_CLIENT_ID: ${DAKIA_GMAIL_CLIENT_ID:-}
      DAKIA_GMAIL_CLIENT_SECRET: ${DAKIA_GMAIL_CLIENT_SECRET:-}
      DAKIA_MICROSOFT_CLIENT_ID: ${DAKIA_MICROSOFT_CLIENT_ID:-}
      DAKIA_MICROSOFT_CLIENT_SECRET: ${DAKIA_MICROSOFT_CLIENT_SECRET:-}
      DAKIA_MICROSOFT_TENANT: ${DAKIA_MICROSOFT_TENANT:-common}
    ports:
      - "127.0.0.1:${DAKIA_PORT:-3025}:3025"
    volumes:
      - data:/data
      - secrets:/secrets
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
volumes:
  data:
  secrets:
