[workspace]
members = ["crates/domain", "crates/storage", "crates/server", "crates/mail-provider", "crates/inference"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# SQLx 0.8 pins an older wrapper whose bundled SQLite 3.46.0 corrupts FTS5
# secure-delete indexes under normal update churn. Keep its API, not its engine.
[patch.crates-io]
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }
