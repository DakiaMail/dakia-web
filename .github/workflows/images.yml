name: Container images
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
env:
  IMAGE: ghcr.io/dakiamail/dakia-web
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-${{ matrix.arch }}
      - name: Check the packaged runtime
        run: |
          docker pull "$IMAGE:$VERSION-${{ matrix.arch }}"
          docker run --rm --network none --entrypoint node "$IMAGE:$VERSION-${{ matrix.arch }}" /app/workers/translation/smoke.mjs
          name="dakia-smoke-${{ matrix.arch }}"
          trap 'docker rm -f "$name" >/dev/null' EXIT
          docker run -d --name "$name" --network none -e DAKIA_ORIGIN=https://mail.test "$IMAGE:$VERSION-${{ matrix.arch }}"
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec "$name" /app/dakia-healthcheck; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          docker exec "$name" test -s /secrets/setup-token
          before=$(docker exec "$name" sha256sum /secrets/credential-key)
          docker restart "$name"
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec "$name" /app/dakia-healthcheck; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          test "$before" = "$(docker exec "$name" sha256sum /secrets/credential-key)"
  manifest:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
