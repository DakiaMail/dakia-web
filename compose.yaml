name: dakia
services:
  dakia:
    image: ${DAKIA_IMAGE:-ghcr.io/dakiamail/dakia-web@sha256:bfdd4d142556471160efd8c294c1e0e781806de85ae46902dd1e3ae71c025bf7}
    restart: unless-stopped
    environment:
      DAKIA_ADMIN_USERS: ${DAKIA_ADMIN_USERS:-}
      DAKIA_ORIGIN: ${DAKIA_ORIGIN:?Set the external HTTPS address in .env}
      DAKIA_RELEASE_CHECKS: ${DAKIA_RELEASE_CHECKS:-true}
      DAKIA_GMAIL_CLIENT_ID: ${DAKIA_GMAIL_CLIENT_ID:-}
      DAKIA_GMAIL_CLIENT_SECRET: ${DAKIA_GMAIL_CLIENT_SECRET:-}
      DAKIA_MICROSOFT_CLIENT_ID: ${DAKIA_MICROSOFT_CLIENT_ID:-}
      DAKIA_MICROSOFT_CLIENT_SECRET: ${DAKIA_MICROSOFT_CLIENT_SECRET:-}
      DAKIA_MICROSOFT_TENANT: ${DAKIA_MICROSOFT_TENANT:-common}
    ports:
      - "127.0.0.1:${DAKIA_PORT:-3025}:3025"
    volumes:
      - data:/data
      - secrets:/secrets
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
volumes:
  data:
  secrets:
