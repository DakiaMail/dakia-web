protocols = imap
listen = *
ssl = required
ssl_cert = </fixture/cert.pem
ssl_key = </fixture/key.pem
disable_plaintext_auth = yes
auth_mechanisms = plain login
log_path = /dev/stdout
info_log_path = /dev/stdout
mail_location = maildir:/srv/mail/%u/Maildir
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
passdb {
  driver = static
  args = password=fixture-only-password
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%u
}
namespace inbox {
  inbox = yes
  separator = /
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Archive {
    auto = create
    special_use = \Archive
  }
  mailbox Junk {
    auto = create
    special_use = \Junk
  }
}
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
