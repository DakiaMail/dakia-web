name: dakia
services:
  dakia:
    image: ${DAKIA_IMAGE:-ghcr.io/dakiamail/dakia-web:edge@sha256:cf65a19ccd68ef045daa8675721e8767c3ff255f2ff09b8f49e32ce481631742}
    restart: unless-stopped
    environment:
      DAKIA_ORIGIN: ${DAKIA_ORIGIN:?Set the external HTTPS address in .env}
    ports:
      - "127.0.0.1:${DAKIA_PORT:-3025}:3025"
    volumes:
      - data:/data
      - secrets:/secrets
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
volumes:
  data:
  secrets:
