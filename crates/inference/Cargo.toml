[package]
name = "dakia-inference"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[dependencies]
anyhow = "1"
dakia-domain = { path = "../domain" }
chrono = "0.4"
mail-parser = { version = "0.11", features = ["full_encoding"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
regex = "1"
scraper = { version = "0.24", default-features = false }
url = "2"
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "download-binaries", "tls-native", "copy-dylibs"] }
sha2 = "0.10"
tokenizers = "=0.22.2"

[dev-dependencies]
tempfile = "3"
